name: pdm-backend

x-app-env: &app-env
  ENV: development
  PORT: "8080"
  # Points at the "db" service below, not whatever DATABASE_URL is in your
  # .env file (that one is typically a cloud host like Neon).
  DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-pdm_backend}?sslmode=disable
  JWT_SECRET: ${JWT_SECRET:-dev_only_secret_at_least_32_characters_long}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-pdm_backend}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pdm-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pdm_backend}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    environment:
      <<: *app-env
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  # One-off: `docker compose run --rm migrate` (not started by `up`).
  migrate:
    build: .
    entrypoint: ["./migrate"]
    environment:
      <<: *app-env
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]

volumes:
  pdm-db-data:
